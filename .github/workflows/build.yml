name: Build & Deploy

on:
  schedule:
    - cron: '0 5 * * *'   # täglich um 05:00 UTC
  push:
    branches: [main]       # auch bei jedem Push auf main
  workflow_dispatch:       # und manuell auslösbar im GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # nötig um index.html zurück ins Repo zu schreiben

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Run build script
        run: python build.py

      - name: Commit & push updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: rebuild index.html from ORCID [$(date -u +%Y-%m-%d)]"
          git push
